let answered=0;
let correctCount=0;

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [array[i],array[j]]=[array[j],array[i]];

  }

}

function loadQuiz(random=false){

  const container=document.getElementById("quizContainer");

  container.innerHTML="";

  answered=0;
  correctCount=0;

  updateScore();

  let quiz=[...originalQuestions];

  if(random){
    shuffle(quiz);
  }

  quiz.forEach((q,index)=>{

    const card=document.createElement("div");

    card.className="question-card";

    card.innerHTML=`
      <h2>Pregunta ${index+1}</h2>
      <div class="question">${q.q}</div>
      <div class="options"></div>
      <div class="explanation">${q.explanation}</div>
    `;

    const optionsDiv=card.querySelector(".options");

    const explanation=card.querySelector(".explanation");

    q.options.forEach((opt,optIndex)=>{

      const btn=document.createElement("button");

      btn.innerText=opt;

      btn.onclick=()=>{

        if(card.dataset.answered) return;

        card.dataset.answered=true;

        answered++;

        if(optIndex===q.answer){

          btn.classList.add("correct");

          correctCount++;

        }else{

          btn.classList.add("incorrect");

          optionsDiv.children[q.answer].classList.add("correct");

        }

        explanation.style.display="block";

        updateScore();

      };

      optionsDiv.appendChild(btn);

    });

    container.appendChild(card);

  });

}

function updateScore(){

  document.getElementById("scoreText").innerText=
  `${correctCount} correctas de ${answered} respondidas`;

  const percent=(answered/originalQuestions.length)*100;

  document.getElementById("progressBar").style.width=
  percent+"%";

}

loadQuiz(false);

</script>
